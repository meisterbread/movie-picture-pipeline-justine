name: Backend CD

on:
  push:
    branches: [main]
    paths:
      - "starter/backend/**"
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - uses: actions/checkout@v4

      - run: pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run lint
      - run: pipenv run test

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        run: docker build -t ${{ secrets.BACKEND_ECR }}:${{ github.sha }} .

      - name: Push Image
        run: docker push ${{ secrets.BACKEND_ECR }}:${{ github.sha }}

      - name: Deploy
        run: |
          cd k8s
          kustomize edit set image backend=${{ secrets.BACKEND_ECR }}:${{ github.sha }}
          kustomize build | kubectl apply -f -
